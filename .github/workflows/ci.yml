name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run tests
        run: pytest -q

      - name: Validate Compose file
        env:
          POSTGRES_PASSWORD: ci-test-password
          DATABASE_URL: postgresql+psycopg://schulungsplantool:ci-test-password@postgres:5432/schulungsplantool
        run: docker compose config >/dev/null

      - name: Build application image
        run: docker build --build-arg APP_VERSION="$(cat VERSION)" -t schulungsplantool:ci .
